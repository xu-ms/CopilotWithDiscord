[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "copilotd"
version = "0.1.0"
description = "Always-on Discord bridge for the GitHub Copilot SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.22.1,<1",
  "croniter>=6.2.4,<7",
  "discord.py>=2.7.1,<3",
  "github-copilot-sdk==1.0.8",
  "pillow>=12.3.0,<13",
  "platformdirs>=4.11.0,<5",
  "pydantic-settings>=2.14.2,<3",
  "structlog>=26.1.0,<27",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.3.0,<2",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-timeout>=2.4.0,<3",
  "ruff==0.16.1",
]

[project.scripts]
copilotd = "copilotd.cli:main"
copilotd-live-acceptance = "copilotd.acceptance.live_scheduler_worktree:main"
copilotd-design-html = "copilotd.ops.design_html:main"
copilotd-ops-audit = "copilotd.ops.audit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copilotd"]

[tool.hatch.build.targets.sdist]
include = [
  "/.github/workflows/ops-acceptance.yml",
  "/README.md",
  "/docs",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
