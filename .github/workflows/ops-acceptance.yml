name: Operations acceptance

on:
  workflow_dispatch:
    inputs:
      macos:
        description: Run the credentialed real-macOS service and soak lane
        required: true
        default: false
        type: boolean
      windows:
        description: Run the credentialed real-Windows Task Scheduler lane
        required: true
        default: false
        type: boolean

jobs:
  macos:
    if: inputs.macos
    runs-on: [self-hosted, macOS, copilotd-acceptance]
    timeout-minutes: 90
    env:
      COPILOTD_DISCORD_TOKEN: ${{ secrets.COPILOTD_DISCORD_TOKEN }}
      COPILOTD_ACCEPTANCE_SOAK_SECONDS: "3600"
      COPILOTD_ACCEPTANCE_ALLOW_SLEEP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Verify preauthenticated Copilot identity
        run: >-
          copilotd sdk-probe --live --timeout 60
          --prompt "Reply with exactly COPILOTD_ACCEPTANCE_AUTH_OK"
          --expect-response COPILOTD_ACCEPTANCE_AUTH_OK
      - run: scripts/acceptance-macos.sh

  windows:
    if: inputs.windows
    runs-on: [self-hosted, Windows, copilotd-acceptance]
    timeout-minutes: 30
    env:
      COPILOTD_DISCORD_TOKEN: ${{ secrets.COPILOTD_DISCORD_TOKEN }}
      COPILOTD_ACCEPTANCE_ALLOW_SLEEP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install .
      - name: Verify preauthenticated Copilot identity
        shell: pwsh
        run: >-
          copilotd sdk-probe --live --timeout 60
          --prompt "Reply with exactly COPILOTD_ACCEPTANCE_AUTH_OK"
          --expect-response COPILOTD_ACCEPTANCE_AUTH_OK
      - shell: pwsh
        run: scripts/acceptance-windows.ps1
